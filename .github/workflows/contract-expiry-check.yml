name: Contract Expiry Check
on:
  schedule:
    - cron: '0 17 * * *'     # 01:00 SGT = 17:00 UTC daily
  workflow_dispatch:
jobs:
  trigger:
    runs-on: ubuntu-latest
    # Bound the job. Run #16 sat for 15m: the expiry call burned its whole
    # retry budget against a backend that never answered, and nothing capped it.
    timeout-minutes: 12
    steps:
      # Fail early with a readable message rather than letting curl die on an
      # empty URL — a missing secret used to surface only as "exit code 3".
      - name: Check required secrets are set
        env:
          BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          missing=0
          if [ -z "$BACKEND_URL" ]; then
            echo "::error::Repository secret RENDER_BACKEND_URL is not set. Add it under Settings > Secrets and variables > Actions, e.g. https://your-app.onrender.com (no trailing slash)."
            missing=1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Repository secret CRON_SECRET is not set. It must be the same value as the CRON_SECRET environment variable on the Render service."
            missing=1
          fi
          [ "$missing" -eq 0 ] || exit 1

      # Render's free tier sleeps after ~15 min idle. Until now the expiry call
      # itself absorbed the wake-up, and a single curl attempt only allows 120 s
      # — a cold service plus a cold Postgres pool can exceed that, which is
      # exactly how run #16 failed. Waking it on /health first means the call
      # that matters starts against a warm service.
      #
      # /health is unauthenticated and does no work, so polling it is free. This
      # also removes the workflow's dependence on UptimeRobot still running: if
      # that monitor is paused, the job now wakes the service by itself.
      - name: Wake the backend
        env:
          BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
        run: |
          url="${BACKEND_URL%/}/health"
          echo "Waking ${url}"
          for i in $(seq 1 8); do
            # Assign the fallback OUTSIDE the substitution: on a connection
            # failure curl still prints 000 via -w, so `|| echo 000` inside
            # would concatenate to "000000". The || also stops a refused
            # connection (service still booting) aborting the loop under set -e.
            status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$url") || status="000"
            if [ "$status" = "200" ]; then
              echo "Backend awake after attempt ${i}."
              exit 0
            fi
            echo "Attempt ${i}: HTTP ${status} — not up yet, waiting 10s"
            sleep 10
          done
          echo "::error::Backend did not answer /health after 8 attempts (~5 min). The Render service is likely suspended, crashed, or mid-deploy — check the Render dashboard rather than this workflow."
          exit 1

      - name: Call vendor expiry-check endpoint
        env:
          BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Strip a trailing slash so we never build a //api/... URL (404).
          url="${BACKEND_URL%/}/api/admin/vendors/expiry-check"
          echo "Calling ${url}"

          # Render's free tier sleeps, so the first connect can take ~50 s.
          # Capture status separately from body: without --fail, curl exits
          # non-zero only on a connection failure, so the || branch means
          # "could not reach the server" and the case means "server said no".
          status=$(curl -sS -o response.json -w '%{http_code}' \
            --max-time 120 --retry 2 --retry-delay 15 --retry-connrefused \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "$url") || {
              echo "::error::Could not reach the backend at ${url}. Check the Render service is deployed and that RENDER_BACKEND_URL is correct."
              exit 1
            }

          echo "HTTP ${status}"
          cat response.json || true
          echo

          case "$status" in
            200)
              echo "Expiry check completed."
              ;;
            401)
              echo "::error::401 UNAUTHORIZED — the CRON_SECRET repository secret does not match CRON_SECRET on the Render service."
              exit 1
              ;;
            404)
              echo "::error::404 NOT FOUND — route not mounted. Confirm the deployed build includes /api/admin/vendors and that RENDER_BACKEND_URL points at the backend, not the frontend."
              exit 1
              ;;
            5*)
              echo "::error::HTTP ${status} — the endpoint errored. See the response body above and the Render logs."
              exit 1
              ;;
            *)
              echo "::error::Unexpected HTTP ${status} from the expiry-check endpoint."
              exit 1
              ;;
          esac
