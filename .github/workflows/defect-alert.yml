name: Defect Alert Email (Demo)
# Manually triggered from the GitHub Actions tab (Run workflow) during the
# presentation. Calls the cron-guarded endpoint, which emails a sample defect
# alert to everyone on the backend's DEFECT_ALERT_RECIPIENTS list.
on:
  workflow_dispatch:
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Send defect-assignment alert to the team
        run: |
          curl -X GET "${{ secrets.RENDER_BACKEND_URL }}/api/inspections/defect-alert-demo" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --fail --max-time 60
